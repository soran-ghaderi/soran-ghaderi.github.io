  <section>
    <h3>About</h3>
  <p>
  Incoming DPhil student in computer science, starting autumn 2026.
  Currently ML Research Engineer at <a href="https://www.costarnetwork.co.uk/directory/soran-ghaderi">CoSTAR National Lab</a> working on video and world models for virtual production.
  Previously research intern at UIUC Blender Lab (energy-based models).
  MSc AI (Distinction) from the University of Essex, supervised by 
  <a href="https://www.essex.ac.uk/people/CITIL35902/Luca Citi">Prof. Luca Citi</a>.
  </p>
  </section>
  
  <section>
    <h3>Research Interests</h3>
  <p>I work on generative models for inverse problems. Measurements are usually partial and noisy, so the interesting part is the prior. I use diffusion and score-based models, flow matching and stochastic interpolants, Schrödinger bridges, optimal transport, and energy-based models as learned priors and samplers, built on ODEs and SDEs, Fokker-Planck, and Itô calculus.</p>
  <p>I find general methods particularly interesting which improve with data, compute, and better algorithms that don't compete with learning from data. Amortised and simulation-based inference is that bet in practice. Pretrain once, then answer each new case from knowledge with calibrated uncertainty.</p>
  <p><strong>Current focus.</strong> A common view of diffusion, Schrödinger bridges, flows, and energy-based models through statistical mechanics and differential geometry, with cardiac digital twins as the testbed.</p>
  </section>
  
  <section>
    <h3>Writing</h3>
    <p>
      <span class="badge badge-new badge-pulse">New</span>
      <a href="/blog/video-world-models/" style="font-weight: 500;">Video World Models</a>,
      <span style="color: var(--text-muted);">on turning slow bidirectional diffusion into real-time interactive simulators.
      Causality, self-forcing, attention sinks.</span>
    </p>
  </section>
  
  <section>
