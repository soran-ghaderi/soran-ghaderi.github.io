  <section>
    <h3>About</h3>
  <p>
  DPhil (PhD) student in Computer Science at the University of Oxford advised by Prof. <a href="https://www.cs.ox.ac.uk/people/alfonso.bueno-orovio/">Alfonso Bueno-Orovio</a>.
  Previously research intern at UIUC Blender Lab (energy-based models).
  MSc AI (Distinction) from the University of Essex, advised by Prof. 
  <a href="https://www.essex.ac.uk/people/CITIL35902/Luca Citi">Luca Citi</a>.
  </p>
  </section>
  
  <section>
    <h3>Research Interests</h3>
    <p>What are the fundamental invariances that can compose and create intelligence? My ultimate goal is to understand and build intelligence.</p>
    <p>Many interesting scientific questions need modeling non-linear and chaotic dynamical systems. Some are intrinsically ill-posed and have non-unique solutions and need a probabilistic language. I'm interested in developing models able to represent such dynamics natively.</p>
    <p>Inverse problems usually need to be solved from noisy and partially observed data. The question is how can we learn the global representation of the underlying dynamics under data constraints? Given that I tend to avoid handcrafting physics and learning-competing inductive biases explicitly (for generalizability and scalability reasons), data-efficient self-supervised learning methods are another line of work I'm keen to work on.</p>
    <p>I've built TorchEBM that looks at these problems through the lens of statistical mechanics and information geometry, differential and Riemannian geometry, Itô and stochastic calculus, and Optimal Transport.</p>
    </section>
    
  <section>
    <h3>News</h3>
