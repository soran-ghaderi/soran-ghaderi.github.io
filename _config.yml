# =============================================================================
# TYPOGRAPHY CONFIGURATION
# =============================================================================
# Control fonts, weights, size and density site-wide. Pick a `preset` for
# one-line theming, then optionally override any single field. Leave the whole
# block out (or set preset: "modern") to keep the site's original look.
#
# PRESET OPTIONS  (preset):
#   - "system"      : System UI fonts — no web-font download, instant load
#   - "modern"      : Roboto + Fira Code (DEFAULT — the original look)
#   - "editorial"   : Source Sans 3 body + Fraunces serif headings + JetBrains Mono
#   - "grotesk"     : Inter everywhere + JetBrains Mono (clean, modern)
#   - "book"        : Lora serif + IBM Plex Mono (traditional reading)
#
# OVERRIDES  (each is optional; a non-empty value wins over the preset):
#   - body_font     : any Google Fonts family, e.g. "Inter"     (blank = preset)
#   - heading_font  : family for h1-h6, e.g. "Fraunces"         (blank = same as body)
#   - code_font     : monospace family, e.g. "JetBrains Mono"   (blank = preset)
#   - body_weight   : 100-900, body/paragraph text             (e.g. 300, 400)
#   - heading_weight: 100-900, headings (sub-headings + <strong> track this -100)
#   - base_size     : overall text size, a rem value           (e.g. "1.6rem")
#   - scale         : modular-scale ratio between sizes         (e.g. 1.2, 1.25, 1.333)
#   - line_height   : body line-height / reading density        (e.g. 1.45, 1.6)
#
# Use "system" for any *_font to opt that slot out of web fonts.
# Free-form fonts: make sure the family exists on fonts.google.com and has the
# weight you ask for, or it falls back to the system stack (other fonts unaffected).
#
# READY-MADE TYPE "RECIPES":
#   Original     preset: modern
#   Literary     preset: editorial    body_weight: 400   line_height: 1.55
#   Academic     preset: book         base_size: "1.65rem"
#   Minimal      preset: grotesk      heading_weight: 700
#   Fastest      preset: system
# =============================================================================
typography:
  preset: "modern"          # system | modern | editorial | grotesk | book
  # ---- optional overrides (leave blank to inherit from the preset) ----
  body_font: "Inter"             # e.g. "Source Sans 3"   (blank = preset's body font)
  heading_font: "Inter"          # e.g. "Fraunces"        (blank = same as body)
  code_font: "JetBrains Mono"             # e.g. "JetBrains Mono"   (blank = preset's code font)
  body_weight: "400"           # e.g. 400               (blank = preset)
  heading_weight: ""        # e.g. 600               (blank = preset)
  base_size: ""             # e.g. "1.6rem"          (blank = preset)
  scale: ""                 # e.g. 1.25              (blank = preset)
  line_height: "1.45"           # e.g. 1.45              (blank = preset)

